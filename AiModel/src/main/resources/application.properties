spring.application.name=AiModel
server.port=8170
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.openai.api-key=${GROQ_CLOUD_API}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.embedding.base-url=https://openrouter.ai/api/v1
spring.ai.openai.embedding.model=nvidia/nemotron-3-embed-1b:free
spring.ai.openai.embedding.api-key=${OPEN_ROUTER_API}
spring.datasource.url=jdbc:mariadb://localhost:3308/cesterusers
spring.datasource.username=root
spring.datasource.password=jishu123
spring.flyway.enabled=true
spring.ai.chat.memory.repository.jdbc.initialize-schema=ALWAYS
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=cosine
spring.ai.vectorstore.mariadb.dimensions=2048
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:7089/eureka/
kafka.topics.token-events=Token-Event
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.topics.token-transaction-events=Token-Transaction-Event